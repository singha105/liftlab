name: Analysis

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analysis
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          # The version that wrote uv.lock, so --locked can't fail on a newer lock format.
          version: "0.12.23"
          working-directory: analysis
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Includes the 20,000-user simulator checks against ground truth.
      - run: uv run pytest
